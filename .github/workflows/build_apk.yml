name: Build Android APK & Release

on:
  push:
    branches:
      - main # يتم البناء وتحديث الـ Artifacts عند الرفع على main
    tags:
      - 'v*' # يتم إنشاء Release رسمي عند رفع tag مثل v1.0.0

permissions:
  contents: write # إعطاء صلاحية إنشاء Release ورفع الملفات

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع من GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. تثبيت الحزم والمكتبات
      - name: Install dependencies
        run: flutter pub get

      # 5. بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --release

      # 6. رفع ملف الـ APK كـ Artifact (للتحميل العادي من قسم Actions)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 7. رفع ملف الـ APK إلى GitHub Releases (عند عمل Tag)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}